<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="{% if page.body_class %}{{ page.body_class }}{% endif %}">
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <button class="back-to-top" id="backToTop" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>
  <script>
    var btn = document.getElementById('backToTop');
    window.addEventListener('scroll', function() {
      btn.classList.toggle('visible', window.scrollY > (window.innerWidth <= 600 ? 600 : 800));
    });

    document.addEventListener('click', function(e) {
      var drawer = document.getElementById('nav-drawer');
      var hamburger = document.querySelector('.om-nav-hamburger');
      if (!drawer || !hamburger || !drawer.classList.contains('open')) return;
      if (hamburger.contains(e.target)) return;
      var tappedSubmenuArrow = drawer.contains(e.target) && !e.target.closest('a');
      if (tappedSubmenuArrow) return;
      drawer.classList.remove('open');
    });
  </script>
</body>
</html>
